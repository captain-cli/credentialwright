[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credentialwright"
version = "0.2.0"
description = "Idempotent credential generator for application bootstrapping"
requires-python = ">=3.10"

[project.scripts]
credentialwright = "credentialwright.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
